<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 40" fill="none" role="img" aria-label="DM - digital microphone">
  <!-- Border-perfect short word DM -->
  <rect x="2" y="4" width="44" height="32" rx="4" stroke="currentColor" stroke-width="2" fill="none" />
  <text x="24" y="24.5" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="15" text-anchor="middle" fill="currentColor" letter-spacing="1">DM</text>
  
  <!-- WhatsApp-style voice inequality waveform (starts bigger, ends small) -->
  <rect x="54" y="6" width="4" height="28" rx="2" fill="currentColor" />
  <rect x="63" y="10" width="4" height="20" rx="2" fill="currentColor" />
  <rect x="72" y="13" width="4" height="14" rx="2" fill="currentColor" />
  <rect x="81" y="15.5" width="4" height="9" rx="2" fill="currentColor" />
  <rect x="90" y="17.5" width="4" height="5" rx="2" fill="currentColor" />

  <!-- Vertical Divider -->
  <line x1="106" y1="10" x2="106" y2="30" stroke="currentColor" stroke-width="1" stroke-opacity="0.25" />

  <!-- Domain Name / Wordmark: digital microphone -->
  <text x="120" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-weight="600" font-size="14" fill="currentColor" letter-spacing="-0.2">digital microphone</text>
  <text x="120" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-weight="400" font-size="9.5" fill="currentColor" fill-opacity="0.55" letter-spacing="0.5">digitalmicrophone.com</text>
  <text x="280" y="23" font-size="13">🎙️</text>
</svg>
