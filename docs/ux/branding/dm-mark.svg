<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 40" fill="none" role="img" aria-label="DM Logo">
  <!-- Border-perfect short word DM -->
  <rect x="2" y="4" width="44" height="32" rx="4" stroke="currentColor" stroke-width="2" fill="none" />
  <text x="24" y="24.5" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="15" text-anchor="middle" fill="currentColor" letter-spacing="1">DM</text>
  
  <!-- WhatsApp-style voice inequality waveform (starts bigger, ends small) -->
  <!-- Bar 1: Peak voice pulse (Height 28) -->
  <rect x="54" y="6" width="4" height="28" rx="2" fill="currentColor" />
  <!-- Bar 2: Primary tone (Height 20) -->
  <rect x="63" y="10" width="4" height="20" rx="2" fill="currentColor" />
  <!-- Bar 3: Resonant harmonic (Height 14) -->
  <rect x="72" y="13" width="4" height="14" rx="2" fill="currentColor" />
  <!-- Bar 4: Trailing decay (Height 9) -->
  <rect x="81" y="15.5" width="4" height="9" rx="2" fill="currentColor" />
  <!-- Bar 5: Whisper terminal (Height 5) -->
  <rect x="90" y="17.5" width="4" height="5" rx="2" fill="currentColor" />
</svg>
